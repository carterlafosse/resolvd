openapi: 3.0.3
info:
  title: Resolvd API
  version: 0.3.0
  description: |
    Multi-organization IT helpdesk API. Each organization's data is isolated in every
    query and again by PostgreSQL row-level security.

    **Errors.** Every error response has the same shape (see the `Error` schema):
    `{ "error": { "code", "message", "details"? } }`. Common codes:

    | Status | Code | When |
    | --- | --- | --- |
    | 400 | `BAD_REQUEST` | Generic bad request |
    | 400 | `INVALID_JSON` | The request body is not valid JSON |
    | 400 | `VALIDATION_ERROR` | Input failed validation; `details` holds `formErrors` and `fieldErrors` |
    | 400 | `INVALID_REFERENCE` | A referenced record doesn't exist |
    | 400 | `INVALID_INPUT` | A value has the wrong format for the database |
    | 400 | `INVALID_PASSWORD` | `PATCH /users/me`: the current password is wrong |
    | 400 | `CANNOT_CHANGE_SELF` | An admin tried to demote or deactivate themselves |
    | 400 | `LAST_ADMIN` | The change would leave the organization with no active admin |
    | 400 | `TICKET_CLOSED` | The ticket is closed and can't be changed |
    | 401 | `UNAUTHORIZED` | Not signed in, or the session expired |
    | 401 | `INVALID_CREDENTIALS` | Login: wrong email or password |
    | 401 | `ACCOUNT_LOCKED` | Login: too many failed attempts; try again in 15 minutes |
    | 403 | `FORBIDDEN` | Signed in, but your role can't do this |
    | 404 | `NOT_FOUND` | The route or record doesn't exist, or you can't see it |
    | 409 | `CONFLICT` | Duplicate value, or the record changed since you loaded it (`expectedUpdatedAt`) |
    | 413 | `PAYLOAD_TOO_LARGE` | The request body is over 100 KB |
    | 415 | `UNSUPPORTED_MEDIA_TYPE` | Unsupported body charset or content encoding |
    | 422 | `UNPROCESSABLE` | Valid input that breaks a business rule |
    | 429 | `TOO_MANY_REQUESTS` | Rate limit reached (300 requests per minute per IP on `/api`; stricter on login and sign-up) |
    | 500 | `INTERNAL_ERROR` | Unexpected server error (no internals are returned) |
    | 503 | `SERVICE_UNAVAILABLE` | A dependency is temporarily unavailable |

    Every response carries an `X-Request-Id` header; quote it when reporting a problem.
servers:
  - url: /api
# Every endpoint needs the session cookie unless it says otherwise (security: []).
security:
  - cookieAuth: []
tags:
  - name: Health
    description: Service status
  - name: Auth
    description: |
      Sign-up, login and sessions. The session is a JWT in the `resolvd_token` cookie
      (HttpOnly, SameSite=Lax, Secure in production, 8 hours). Browsers send it
      automatically; there is no Authorization header.
  - name: Users
    description: User management (admins), the staff directory, and your own account
  - name: Categories
    description: Ticket categories for the signed-in user's organization
  - name: Tickets
    description: |
      IT tickets. End users see only tickets they requested; technicians and admins see every
      ticket in their organization. A ticket you can't see is a 404, never a 403.
paths:
  /auth/register-organization:
    post:
      tags: [Auth]
      summary: Create an organization and its first admin
      description: |
        Creates the organization, its admin user, the default categories and the default SLA
        policies in one transaction, then signs the new admin in (sets the session cookie).
        Any extra fields (such as `role`) are ignored.
        Limited to 5 attempts per hour per IP, counting rejected ones.
      operationId: registerOrganization
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationName, slug, name, email, password]
              properties:
                organizationName: { type: string, minLength: 2, maxLength: 100 }
                slug:
                  type: string
                  pattern: '^[a-z0-9-]{3,50}$'
                  description: URL name, unique across Resolvd.
                name: { type: string, minLength: 1, maxLength: 100 }
                email: { type: string, format: email, description: Trimmed and lowercased. }
                password: { $ref: '#/components/schemas/Password' }
            example:
              organizationName: Initech
              slug: initech
              name: Bill Lumbergh
              email: bill@initech.test
              password: YOUR_PASSWORD_1
      responses:
        '201':
          description: Created and signed in.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: The email is already registered, or the slug is taken.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: CONFLICT
                  message: That email is already registered
                  details:
                    formErrors: []
                    fieldErrors: { email: [That email is already registered] }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in
      description: |
        Sets the session cookie. An unknown email, an inactive account and a wrong password
        all return the same 401. After 5 wrong passwords the account is locked for 15
        minutes. Limited to 10 attempts per 15 minutes per IP.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
            example:
              email: admin@acme.test
              password: YOUR_SEED_PASSWORD
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: Wrong credentials (`INVALID_CREDENTIALS`) or a locked account (`ACCOUNT_LOCKED`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                invalid:
                  value:
                    error: { code: INVALID_CREDENTIALS, message: Invalid email or password }
                locked:
                  value:
                    error:
                      code: ACCOUNT_LOCKED
                      message: Account temporarily locked. Try again later.
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Sign out
      description: Clears the session cookie. Works without a session.
      operationId: logout
      security: []
      responses:
        '204':
          description: Signed out.
  /auth/me:
    get:
      tags: [Auth]
      summary: The signed-in user and their organization
      operationId: getMe
      responses:
        '200':
          description: The current session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users:
    get:
      tags: [Users]
      summary: List users in your organization
      description: |
        Technicians and admins. Admins get full user records; technicians get only
        `id`, `name` and `role` (enough for an assignment dropdown). Sorted by name.
      operationId: listUsers
      parameters:
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/Role' }
        - name: active
          in: query
          schema: { type: string, enum: ['true', 'false'] }
      responses:
        '200':
          description: The users.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/User'
                        - $ref: '#/components/schemas/UserSummary'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users]
      summary: Create a user (admin)
      description: The password is temporary; the user changes it with `PATCH /users/me`.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, role, password]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                email: { type: string, format: email }
                role: { $ref: '#/components/schemas/Role' }
                department: { type: string, maxLength: 100, nullable: true }
                password: { $ref: '#/components/schemas/Password' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/me:
    patch:
      tags: [Users]
      summary: Update your own account
      description: Any signed-in user. Changing the password requires `currentPassword`.
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                emailNotifications: { type: boolean }
                currentPassword: { type: string }
                newPassword: { $ref: '#/components/schemas/Password' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400':
          description: Invalid input, or the current password is wrong (`INVALID_PASSWORD`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users/{id}:
    patch:
      tags: [Users]
      summary: Update a user (admin)
      description: |
        Admins can't demote or deactivate themselves (`CANNOT_CHANGE_SELF`), and the
        organization always keeps at least one active admin (`LAST_ADMIN`). Changes apply
        on the user's next request.
      operationId: updateUser
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                role: { $ref: '#/components/schemas/Role' }
                department: { type: string, maxLength: 100, nullable: true }
                isActive: { type: boolean }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400':
          description: Invalid input, `CANNOT_CHANGE_SELF` or `LAST_ADMIN`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /categories:
    get:
      tags: [Categories]
      summary: List categories
      description: Any signed-in user. Sorted by name.
      operationId: listCategories
      responses:
        '200':
          description: The categories.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Categories]
      summary: Add a category (admin)
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /categories/{id}:
    patch:
      tags: [Categories]
      summary: Rename a category (admin)
      operationId: renameCategory
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '200':
          description: Renamed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /tickets:
    get:
      tags: [Tickets]
      summary: List tickets (the queue)
      description: |
        One page of the tickets you can see, with filters, search and sorting. Each filter
        narrows the result; they combine with AND. Rows leave out `description`.
      operationId: listTickets
      parameters:
        - name: status
          in: query
          description: Comma-separated statuses, for example `open,in_progress`.
          schema: { type: string, example: 'open,in_progress' }
        - name: priority
          in: query
          description: Comma-separated priorities, for example `high,critical`.
          schema: { type: string, example: 'high,critical' }
        - name: assignee
          in: query
          description: '`me`, `unassigned`, or a user id.'
          schema: { type: string, example: me }
        - name: categoryId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: search
          in: query
          description: |
            Matches titles containing the text (case-insensitive; `%` and `_` match
            literally), or a ticket number typed as `RES-1003`, `res-1003` or `1003`.
          schema: { type: string, maxLength: 100 }
        - name: sla
          in: query
          description: Accepted now and applied from Phase 6, when tickets get SLA deadlines.
          schema: { type: string, enum: [breached, at_risk] }
        - name: sort
          in: query
          description: Priority sorts by severity (low < medium < high < critical). Empty values sort last.
          schema:
            type: string
            enum: [created_at, updated_at, priority, resolution_due_at]
            default: created_at
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: One page of tickets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TicketSummary' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Tickets]
      summary: Create a ticket
      description: |
        The signed-in user is the requester. The ticket gets the organization's next number
        (starting at 1001, shown as `RES-1001`) and a `created` event. Only staff may choose
        `critical` priority (403 otherwise).
      operationId: createTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description]
              properties:
                title: { type: string, minLength: 5, maxLength: 200 }
                description: { type: string, minLength: 10, maxLength: 5000 }
                priority: { $ref: '#/components/schemas/TicketPriority' }
                categoryId: { type: integer, minimum: 1, nullable: true }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400':
          description: Invalid input, or `categoryId` isn't a category in your organization.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tickets/{id}:
    get:
      tags: [Tickets]
      summary: Get a ticket
      operationId: getTicket
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The ticket.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Tickets]
      summary: Edit a ticket's details
      description: |
        The requester may change title, description and category while the ticket is `open`.
        Staff may change those and the priority at any status except `closed`; nobody can
        edit a closed ticket (`TICKET_CLOSED`). Each changed field writes one event; fields
        sent with their current value are ignored.

        Send `expectedUpdatedAt` (the `updated_at` you loaded) to avoid overwriting someone
        else's change: if the ticket changed since, the response is 409.
      operationId: updateTicket
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: At least one of title, description, priority or categoryId.
              properties:
                title: { type: string, minLength: 5, maxLength: 200 }
                description: { type: string, minLength: 10, maxLength: 5000 }
                priority: { $ref: '#/components/schemas/TicketPriority' }
                categoryId:
                  type: integer
                  minimum: 1
                  nullable: true
                  description: '`null` removes the category.'
                expectedUpdatedAt: { type: string, format: date-time }
      responses:
        '200':
          description: The updated ticket.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400':
          description: Invalid input, unknown category, or `TICKET_CLOSED`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            The requester tried to edit a ticket that is no longer open, or to change the
            priority (staff only).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The ticket changed since `expectedUpdatedAt`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: CONFLICT
                  message: This ticket was changed by someone else. Reload and try again.
  /health:
    get:
      tags: [Health]
      summary: Check the API and database
      description: Runs `SELECT 1` against the database. Used by Render's health check.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: The API is running and the database is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                database: up
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: The API is running but cannot reach the database.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: degraded
                database: down
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: resolvd_token
      description: Set by login or sign-up. In Swagger UI, sign in with POST /auth/login first.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  headers:
    SessionCookie:
      description: '`resolvd_token=<JWT>; Max-Age=28800; Path=/; HttpOnly; SameSite=Lax` (plus `Secure` in production)'
      schema: { type: string }
  schemas:
    Role:
      type: string
      enum: [end_user, technician, admin]
    Password:
      type: string
      minLength: 10
      maxLength: 72
      description: 10 to 72 characters (at most 72 bytes), with at least one letter and one number.
    User:
      type: object
      description: A user as admins and the user themselves see it. Never includes the password hash.
      properties:
        id: { type: integer }
        organization_id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        department: { type: string, nullable: true }
        is_active: { type: boolean }
        email_notifications: { type: boolean }
        locked_until: { type: string, format: date-time, nullable: true }
        last_login_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UserSummary:
      type: object
      description: What technicians see when listing users.
      properties:
        id: { type: integer }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
    Organization:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
    Session:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        organization: { $ref: '#/components/schemas/Organization' }
    Category:
      type: object
      properties:
        id: { type: integer }
        organization_id: { type: integer }
        name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
    TicketStatus:
      type: string
      enum: [open, in_progress, on_hold, resolved, closed]
    TicketPriority:
      type: string
      enum: [low, medium, high, critical]
      default: medium
    TicketSummary:
      type: object
      description: A queue row. Deadlines are set from Phase 6.
      properties:
        id: { type: integer }
        organization_id: { type: integer }
        ticket_number: { type: integer, example: 1001 }
        display_id: { type: string, example: RES-1001 }
        title: { type: string }
        status: { $ref: '#/components/schemas/TicketStatus' }
        priority: { $ref: '#/components/schemas/TicketPriority' }
        category_id: { type: integer, nullable: true }
        category_name: { type: string, nullable: true }
        requester_id: { type: integer }
        requester_name: { type: string }
        assignee_id: { type: integer, nullable: true }
        assignee_name: { type: string, nullable: true }
        response_due_at: { type: string, format: date-time, nullable: true }
        resolution_due_at: { type: string, format: date-time, nullable: true }
        first_response_at: { type: string, format: date-time, nullable: true }
        resolved_at: { type: string, format: date-time, nullable: true }
        closed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Ticket:
      description: A full ticket, as returned by create, get and update.
      allOf:
        - $ref: '#/components/schemas/TicketSummary'
        - type: object
          properties:
            description: { type: string }
    Pagination:
      type: object
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer, description: Matching tickets across all pages. }
        totalPages: { type: integer }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable, machine-readable error code.
              example: NOT_FOUND
            message:
              type: string
              description: Human-readable explanation, safe to show to users.
              example: 'Route not found: GET /api/nope'
            details:
              description: Extra information. For `VALIDATION_ERROR`, the flattened Zod error.
              type: object
              additionalProperties: true
              example:
                formErrors: []
                fieldErrors:
                  email: ['Invalid email address']
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [up, down]
  responses:
    ValidationError:
      description: The input failed validation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: VALIDATION_ERROR
              message: Validation failed
              details:
                formErrors: []
                fieldErrors: { name: [Too small: expected string to have >=1 characters] }
    Unauthorized:
      description: Not signed in, or the session expired or is no longer valid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: UNAUTHORIZED, message: Authentication required }
    Forbidden:
      description: Signed in, but your role can't do this.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: FORBIDDEN, message: You do not have permission to do that }
    NotFound:
      description: It doesn't exist, or it belongs to another organization.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: The value is already in use.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate limit reached.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: TOO_MANY_REQUESTS
              message: Too many requests. Try again later.
